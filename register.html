<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - ABHI'S MARKET</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .register-container {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #0f172a;
            font-size: 28px;
        }

        .logo span {
            color: #38bdf8;
        }

        .logo p {
            color: #64748b;
            margin-top: 7px;
        }

        h2 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;

            font-weight: bold;
            color: #334155;
        }

        .input-group input {
            width: 100%;
            padding: 12px;

            border: 1px solid #cbd5e1;
            border-radius: 8px;

            font-size: 15px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .register-btn {
            width: 100%;
            padding: 13px;

            margin-top: 8px;

            background: #0f172a;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #1e293b;
        }

        .login-text {
            text-align: center;
            margin-top: 20px;

            color: #64748b;
        }

        .login-text a {
            color: #0284c7;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>

</head>


<body>

    <div class="register-container">

        <!-- LOGO -->

        <div class="logo">

            <h1>
                ABHI'S <span>MARKET</span>
            </h1>

            <p>
                Smart Business Management
            </p>

        </div>


        <!-- TITLE -->

        <h2>
            Create Account
        </h2>


        <!-- REGISTRATION FORM -->

        <form id="registerForm">


            <!-- BUSINESS NAME -->

            <div class="input-group">

                <label for="shopName">
                    Business / Shop Name
                </label>

                <input
                    type="text"
                    id="shopName"
                    placeholder="Enter business name"
                    required
                >

            </div>


            <!-- USER NAME -->

            <div class="input-group">

                <label for="userName">
                    Your Name
                </label>

                <input
                    type="text"
                    id="userName"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- MOBILE -->

            <div class="input-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter mobile number"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >

            </div>


            <!-- CREATE ACCOUNT BUTTON -->

            <button
                type="submit"
                class="register-btn"
            >
                Create Account
            </button>


        </form>


        <!-- MESSAGE -->

        <p id="message"></p>


        <!-- LOGIN LINK -->

        <p class="login-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        document
            .getElementById("registerForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                // Get form values

                const shopName =
                    document.getElementById("shopName").value.trim();

                const userName =
                    document.getElementById("userName").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const mobile =
                    document.getElementById("mobile").value.trim();

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;


                // Check password

                if (password !== confirmPassword) {

                    showMessage(
                        "Passwords do not match.",
                        "red"
                    );

                    return;
                }


                // Create user object

                const user = {

                    shopName: shopName,

                    name: userName,

                    email: email,

                    mobile: mobile,

                    password: password

                };


                // Save user temporarily

                localStorage.setItem(
                    "user",
                    JSON.stringify(user)
                );


                // Show success message

                showMessage(
                    "Account created successfully!",
                    "green"
                );


                // Go to login page

                setTimeout(function() {

                    window.location.href = "login.html";

                }, 1200);

            });


        // Message function

        function showMessage(text, color) {

            const message =
                document.getElementById("message");

            message.innerText = text;

            message.style.color = color;

        }

    </script>

</body>

</html>
