<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ABHI'S MARKET</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #0f172a;
            font-size: 28px;
        }

        .logo span {
            color: #38bdf8;
        }

        .logo p {
            color: #64748b;
            margin-top: 8px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #0f172a;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #0f172a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #1e293b;
        }

        .register-text {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }

        .register-text a {
            color: #0284c7;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <h1>ABHI'S <span>MARKET</span></h1>
            <p>Smart Business Management</p>
        </div>

        <h2>Login</h2>

        <form id="loginForm">

            <div class="input-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <p id="message"></p>

        <p class="register-text">
            New user?
            <a href="register.html">Create Account</a>
        </p>

    </div>

    <script>

        // Login
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const savedUser =
                    JSON.parse(localStorage.getItem("user"));

                if (!savedUser) {

                    showMessage(
                        "No account found. Please create an account first.",
                        "red"
                    );

                    return;
                }

                if (
                    email === savedUser.email &&
                    password === savedUser.password
                ) {

                    // Remember logged-in user
                    localStorage.setItem(
                        "loggedIn",
                        "true"
                    );

                    showMessage(
                        "Login successful! Opening ABHI'S MARKET...",
                        "green"
                    );

                    setTimeout(function() {

                        window.location.href = "index.html";

                    }, 1000);

                } else {

                    showMessage(
                        "Incorrect email or password.",
                        "red"
                    );

                }

            });


        // Register
        function registerUser() {

            const name =
                prompt("Enter your name:");

            if (!name) {
                return;
            }

            const email =
                prompt("Enter your email:");

            if (!email) {
                return;
            }

            const password =
                prompt("Create a password:");

            if (!password) {
                return;
            }

            const user = {

                name: name,
                email: email,
                password: password

            };

            localStorage.setItem(
                "user",
                JSON.stringify(user)
            );

            showMessage(
                "Account created! You can now login.",
                "green"
            );

        }


        // Message
        function showMessage(text, color) {

            const message =
                document.getElementById("message");

            message.innerText = text;
            message.style.color = color;

        }

    </script>

</body>

</html>
